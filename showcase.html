<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Microbots Showcase</title>
    <script src="https://cdn.tailwindcss.com/3.4.10"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body class="m-0 overflow-hidden bg-[#150e0d] font-['Space_Grotesk'] text-neutral-200 antialiased">
    <canvas id="stage" class="block h-screen w-screen"></canvas>
    <div id="ui" class="pointer-events-none fixed inset-0 transition-opacity duration-300">
      <div class="absolute left-4 top-4 sm:left-6 sm:top-6">
        <div class="text-xs uppercase tracking-[0.3em] text-neutral-500">SFIT showcase</div>
        <div class="mt-1 flex items-baseline gap-2">
          <span id="count" class="text-3xl font-semibold tabular-nums text-neutral-50"></span>
          <span class="text-sm text-neutral-400">microbots</span>
        </div>
        <div id="status" class="mt-1 h-4 text-xs text-neutral-500"></div>
      </div>
      <div class="absolute bottom-4 left-0 right-0 flex justify-center px-4 sm:bottom-6">
        <div class="pointer-events-auto flex gap-1 rounded-2xl border border-white/10 bg-white/[0.05] p-1 backdrop-blur-md">
          <button id="add" type="button" class="rounded-xl bg-white/10 px-4 py-2 text-sm font-medium text-neutral-50 transition-colors duration-150 hover:bg-white/20 active:scale-[0.97] focus-visible:outline focus-visible:outline-2 focus-visible:outline-white/40">+1 bot <span class="ml-1 text-neutral-400">Space</span></button>
          <button id="morph" type="button" class="rounded-xl px-4 py-2 text-sm text-neutral-300 transition-colors duration-150 hover:bg-white/10 hover:text-neutral-50 active:scale-[0.97] focus-visible:outline focus-visible:outline-2 focus-visible:outline-white/40">Morph <span class="ml-1 text-neutral-500">M</span></button>
          <a href="./index.html" class="rounded-xl px-4 py-2 text-sm text-neutral-300 no-underline transition-colors duration-150 hover:bg-white/10 hover:text-neutral-50">Swarm</a>
        </div>
      </div>
    </div>
    <script type="module" src="./showcase.js"></script>
  </body>
</html>
